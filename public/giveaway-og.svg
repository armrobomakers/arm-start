<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ARM — Розыгрыш среди участников</title>
  <desc id="desc">Рейтинг участников, купоны, прогресс до финала и призы ARM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9fc"/>
      <stop offset="0.58" stop-color="#e8f5f8"/>
      <stop offset="1" stop-color="#eef6eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72a96b"/>
      <stop offset="1" stop-color="#4e78b6"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#4e78b6" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1050" cy="110" r="210" fill="#82c7d7" opacity="0.17"/>
  <circle cx="120" cy="560" r="240" fill="#72a96b" opacity="0.08"/>

  <g transform="translate(72 70)">
    <rect x="0" y="0" width="174" height="54" rx="27" fill="#ffffff" fill-opacity="0.72" stroke="#4e78b6" stroke-opacity="0.12"/>
    <circle cx="28" cy="27" r="9" fill="#72a96b"/>
    <text x="52" y="34" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#10253f">ARM</text>
  </g>

  <text x="72" y="220" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#4e78b6">РОЗЫГРЫШ СРЕДИ УЧАСТНИКОВ</text>
  <text x="72" y="314" font-family="Arial, sans-serif" font-size="76" font-weight="300" fill="#10253f">Топ по купонам.</text>
  <text x="72" y="366" font-family="Arial, sans-serif" font-size="24" fill="#60758f">Рейтинг · прогресс до финала · условия · призы</text>

  <g transform="translate(72 430)">
    <rect width="680" height="110" rx="26" fill="#ffffff" fill-opacity="0.76" stroke="#4e78b6" stroke-opacity="0.12"/>
    <text x="30" y="37" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#71849c">ФИНАЛ ПРИ 600 КУПОНАХ</text>
    <rect x="30" y="58" width="620" height="12" rx="6" fill="#4e78b6" fill-opacity="0.12"/>
    <rect x="30" y="58" width="79" height="12" rx="6" fill="url(#accent)"/>
    <text x="30" y="94" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10253f">Каждые 500 USD личных продаж = 1 купон</text>
  </g>

  <g transform="translate(815 385)">
    <rect width="310" height="155" rx="30" fill="url(#accent)"/>
    <text x="28" y="42" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#e4f5ef">ГЛАВНЫЙ ПРИЗ</text>
    <text x="28" y="92" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Автомобиль</text>
    <text x="28" y="126" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">35 000 USD</text>
  </g>
</svg>
